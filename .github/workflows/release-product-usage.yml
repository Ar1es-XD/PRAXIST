name: Release Product Usage Collector

on:
  push:
    tags:
      - "product-usage-v*"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: product-usage-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sapientinc/praxist-collector

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tag on current main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: services/product_usage/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=product-usage-collector
          cache-to: type=gha,mode=max,scope=product-usage-collector

      - name: Scan immutable image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Report immutable image
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
