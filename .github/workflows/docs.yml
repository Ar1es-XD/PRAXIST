name: docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python
        run: uv python install 3.11

      - name: Install documentation dependencies
        run: uv sync --extra docs

      - name: Build strict documentation site
        run: uv run python scripts/build_docs_site.py

      - name: Verify generated reference pages
        run: |
          uv run python scripts/build_docs_site.py --check-generated
          git diff --exit-code -- docs/reference/cli.md docs/reference/skills.md

      - name: Upload GitHub Pages artifact
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PRAXIST_PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PRAXIST_PAGES_ENABLED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
