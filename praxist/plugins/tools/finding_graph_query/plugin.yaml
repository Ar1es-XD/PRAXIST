schema_version: 1
name: finding_graph_query
kind: tool_server
version: 0.1.0
protocol_version: 1
stability: experimental
description: Read-only finding graph query MCP surface for graph context and recent finding lookup.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies:
  - kind: workflow_stage
    name: research_loop
  - kind: graph_maintainer
    name: finding_graph_mvp
capabilities:
  - tool_server.finding_graph_query
  - tool.finding_graph_lookup
  - tool.unlinked_recent_findings
tool_server:
  server_name: finding-graph-query
  tool_names:
    - get_finding_neighbors
    - get_finding_subgraph
    - get_unlinked_recent_findings
  visibility:
    - peer
    - panel
  required_capability: tool_server.finding_graph_query
entrypoint: adapter:create_tool_plugin
code:
  - adapter.py
  - __main__.py
assets: []
