schema_version: 1
name: anthropic_messages
kind: model_provider
version: 0.1.0
protocol_version: 1
stability: experimental
description: Anthropic messages provider adapter spec.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - provider.anthropic_messages
  - prompt_cache
provider:
  api_format: anthropic_messages
  default_model: claude-opus-4-7
  cache_strategy: provider_explicit_cache
  explicit_cache_strategy: anthropic_messages_cache_control
  usage_reporting: usage_or_usage_unknown
  model_profiles:
    cheap_peer: claude-sonnet-4-5
    strong_reasoner: claude-opus-4-7
  compatible_model_patterns:
    - "claude-*"
entrypoint: adapter:create_provider
code:
  - adapter.py
assets: []
