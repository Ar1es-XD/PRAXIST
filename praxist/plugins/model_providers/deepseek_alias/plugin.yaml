schema_version: 1
name: deepseek_alias
kind: model_provider
version: 0.1.0
protocol_version: 1
stability: experimental
description: DeepSeek alias on the OpenAI-compatible adapter path.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - provider.openai_compatible
  - provider.deepseek
provider:
  api_format: openai_compatible
  # ``deepseek-v4-flash`` is the cheap/fast tier; ``deepseek-v4-pro``
  # is the strong-reasoner tier. The legacy ``deepseek-chat`` /
  # ``deepseek-reasoner`` names served by the DeepSeek API up to
  # 2026-05 are no longer accepted (see #144); switching the
  # defaults here unblocks every run that doesn't pass an explicit
  # ``--model`` flag. The ``deepseek*`` compatible_model_pattern
  # still routes operator-supplied legacy names through this
  # provider so a model override of ``deepseek-chat`` still hits
  # the OpenAI-compatible adapter rather than failing plugin
  # resolution.
  # DeepSeek direct-key defaults. Keep these in the provider manifest so
  # startup, replay metadata, and operator overrides share one source of truth.
  # Main research runs default to the stronger DeepSeek V4 Pro route; cheap
  # peer/subagent routing remains explicit through the ``cheap_peer`` profile.
  default_model: deepseek-v4-pro[1m]
  cache_strategy: provider_default
  usage_reporting: usage_or_usage_unknown
  model_profiles:
    cheap_peer: deepseek-v4-flash
    strong_reasoner: deepseek-v4-pro
  compatible_model_patterns:
    - "deepseek*"
entrypoint: adapter:create_provider
code:
  - adapter.py
assets: []
