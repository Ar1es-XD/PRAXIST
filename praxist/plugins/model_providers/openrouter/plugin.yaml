schema_version: 1
name: openrouter
kind: model_provider
version: 0.1.0
protocol_version: 1
stability: experimental
description: OpenRouter provider adapter spec.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - provider.openrouter
  - provider.routing
provider:
  api_format: openrouter
  default_model: anthropic/claude-opus-4.7
  cache_strategy: provider_default
  usage_reporting: usage_or_usage_unknown
  model_profiles:
    cheap_peer: anthropic/claude-sonnet-4.5
    strong_reasoner: anthropic/claude-opus-4.7
  compatible_model_patterns:
    - "*/*"
entrypoint: adapter:create_provider
code:
  - adapter.py
assets: []
