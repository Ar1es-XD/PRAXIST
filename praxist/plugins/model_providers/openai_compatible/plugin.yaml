schema_version: 1
name: openai_compatible
kind: model_provider
version: 0.1.0
protocol_version: 1
stability: experimental
description: OpenAI-compatible provider adapter spec.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - provider.openai_compatible
provider:
  api_format: openai_compatible
  default_model: gpt-5.2
  cache_strategy: provider_default
  usage_reporting: usage_or_usage_unknown
  model_profiles:
    cheap_peer: gpt-5.2-mini
    strong_reasoner: gpt-5.2
  compatible_model_patterns:
    - "gpt-*"
    - "o*"
entrypoint: adapter:create_provider
code:
  - adapter.py
assets: []
