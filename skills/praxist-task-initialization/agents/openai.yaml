interface:
  display_name: "Praxist Task Initialization"
  short_description: "Create hardware-sized Praxist task projects"
  default_prompt: "Use $praxist-task-initialization to convert an existing runnable research project into a Praxist task directory that follows the user's explicit protocol intent for launch, ranking, maturity, parent use, and close without imposing a universal full-only protocol; include task-owned maturity ratios and stage labels, an evidence-gated normal-close policy and closing lifecycle regression, explicit metric directions, robust domain ranking rules, protocol-integrity checks, exact-result artifact capacity semantics, explicit parent-eligible durable incubator/Pareto lanes for eligible non-suspect candidates, evaluator source labels and a task-local reachability/Pareto routing regression that keep every configured parent lane live, non-parentable validation/diagnostic lanes, DIG limited to absolute generation 0 by default, independently enabled initial and later PI-synthesis quality diversity with separate planned and realized design dimensions, Gems reset off by default, preliminary versus near-complete-coverage aligned evaluation as the recommended default when complete scoring is expensive, baseline performance found/measured/explicitly marked, platform-probed resource profiles and applicable accelerator handoff validation, natural-unit parallelism, idle resource-supply feedback, run-report tooling, and DeepSeek V4 Pro plus Claude SDK launch guidance when DEEPSEEK_API_KEY is available unless the user overrides it; otherwise preserve an available provider fallback."
