schema_version: 1
name: toy_math_external_validity_pi
kind: role
version: 0.1.0
protocol_version: 1
stability: v1_stable
description: External-validity PI role for high-stakes toy-math claims.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - role.skill
  - pi.memo
  - pi.private_kb
role:
  role_id: external_validity
  legacy_role_id: external_validity
  display_name: Toy Math External Validity PI
  role_kind: pi
  default_model_profile_ref: strong_reasoner
  output_schema_ref: core:pi_memo.v1
  tool_scope:
    - filesystem.read
    - memory_tools.panel_read
  private_kb:
    - private_kb/cross_arch_protocols.md
  fixed_questions:
    - Does the claim survive a wider bounded search range?
    - Does it survive alternative parameterizations of the sequence or identity?
    - Is the proof sketch stronger than finite checking?
    - Which reviewer attack patterns apply to this claim?
    - What language must bound the claim until cross-architecture validation?
code: []
assets:
  - skill.md
  - private_kb/*.md
