schema_version: 1
name: machine_learning_template
kind: panel_topology
version: 0.1.0
protocol_version: 1
stability: template
description: Task-local generic machine learning Multi-PI topology.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - panel.multi_pi
  - panel.round1_independent_memos
  - panel.round2_cross_review
  - panel.chair_agenda
  - panel.peer_role_rotation
topology:
  topology_ref: panel_topology:machine_learning_template
  chair_role_ref: task_role:chair
  peer_memo_visibility: anonymized
  high_stakes_triggers:
    - leakage
    - hidden label
    - private data
    - unsupported metric
    - invalid prediction artifact
    - metric direction
  modes:
    mini:
      - task_role:builder_pi
      - task_role:skeptic_pi
    full:
      - task_role:builder_pi
      - task_role:skeptic_pi
      - task_role:portfolio_pi
    high_stakes:
      - task_role:builder_pi
      - task_role:skeptic_pi
      - task_role:portfolio_pi
      - task_role:external_validity_pi
  roles:
    - role_id: builder
      legacy_role_id: builder
      role_ref: task_role:builder_pi
      role_kind: pi
      model_profile_ref: strong_reasoner
      private_pack_key: builder
    - role_id: skeptic
      legacy_role_id: skeptic
      role_ref: task_role:skeptic_pi
      role_kind: pi
      model_profile_ref: strong_reasoner
      private_pack_key: skeptic
    - role_id: portfolio
      legacy_role_id: portfolio
      role_ref: task_role:portfolio_pi
      role_kind: pi
      model_profile_ref: strong_reasoner
      private_pack_key: portfolio
    - role_id: external_validity
      legacy_role_id: external_validity
      role_ref: task_role:external_validity_pi
      role_kind: pi
      model_profile_ref: strong_reasoner
      private_pack_key: external_validity
  rounds:
    - round_id: evidence_freeze
      role_refs: []
      parallelism: 1
      timeout_seconds: 0
      visibility: shared
    - round_id: independent_memos
      role_refs:
        - task_role:builder_pi
        - task_role:skeptic_pi
        - task_role:portfolio_pi
        - task_role:external_validity_pi
      parallelism: 4
      timeout_seconds: 720
      model_profile_ref: strong_reasoner
      visibility: private_pack
    - round_id: cross_review
      role_refs:
        - task_role:builder_pi
        - task_role:skeptic_pi
        - task_role:portfolio_pi
        - task_role:external_validity_pi
      parallelism: 4
      timeout_seconds: 540
      model_profile_ref: strong_reasoner
      visibility: anonymized_peer_memos
    - round_id: chair_synthesis
      role_refs:
        - task_role:chair
      parallelism: 1
      timeout_seconds: 1500
      model_profile_ref: strong_reasoner
      visibility: shared_core_and_memos
  peer_role_rotation:
    - starter
    - solver
    - solver
    - analyst
    - peer_generalist
  peer_role_descriptions:
    starter: Build a strong task-specific starting system from public/task-owned evidence and general ML expertise.
    solver: Improve prediction quality through focused experiments and evaluator-backed results.
    analyst: Analyze data, frontier methods, attempts, logs, and failures before testing an improvement.
    peer_generalist: Choose the most useful task-aligned ML work item from current evidence and PI guidance.
code: []
assets: []
