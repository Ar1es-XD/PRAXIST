  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - role.skill
  - pi.memo
role:
  role_id: portfolio
  legacy_role_id: portfolio
  display_name: ML Portfolio PI
  role_kind: pi
  default_model_profile_ref: strong_reasoner
