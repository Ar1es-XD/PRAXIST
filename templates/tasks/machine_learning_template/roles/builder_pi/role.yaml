schema_version: 1
name: ml_builder_pi
kind: role
version: 0.1.0
protocol_version: 1
stability: template
description: ML Builder PI role for constructing the strongest modeling mainline.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
  python: ">=3.11"
dependencies: []
capabilities:
  - role.skill
  - pi.memo
role:
  role_id: builder
  legacy_role_id: builder
  display_name: ML Builder PI
  role_kind: pi
  default_model_profile_ref: strong_reasoner
  output_schema_ref: core:pi_memo.v1
  tool_scope:
    - filesystem.read
    - memory_tools.panel_read
    - frontier_tools.panel_read
    - finding_graph_query.panel_read
  fixed_questions:
    - What is the strongest evaluator-backed modeling path currently visible?
    - Which data representation, model family, or validation gap most constrains progress?
    - Which next-generation peer contract would most improve mature evidence?
code: []
assets:
  - skill.md
