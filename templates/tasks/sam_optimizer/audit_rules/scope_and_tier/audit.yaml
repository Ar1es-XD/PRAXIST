schema_version: 1
name: scope_and_tier
kind: task_audit
version: 0.1.0
protocol_version: 1
stability: v1_stable
mode: declarative
description: Declarative SAM task criteria for scope, tier metadata, and promotion eligibility.
compatibility:
  praxist_core: ">=0.1.0,<1.0"
dependencies: []
capabilities:
  - audit.scope_boundary
  - audit.tier_metadata
  - audit.promotion_eligibility
audit:
  checks:
    - id: scope_boundary
      severity: blocking
      criteria:
        - Candidate code must implement a drop-in PyTorch Optimizer or optimizer variant only.
        - Candidates must not edit Praxist orchestration, benchmark datasets, scoring code, or training-loop semantics to improve reported results.
    - id: tier_metadata
      severity: warning
      criteria:
        - Findings should record evaluation tier as T1, T2, or T3 when available.
        - Metrics, seeds, dataset split, and command context should be preserved when available.
    - id: promotion_eligibility
      severity: warning
      criteria:
        - Promotion claims should compare against curated baselines and prior frontier results where available.
        - Negative or inconclusive evidence should remain visible rather than being dropped.
assets: []
