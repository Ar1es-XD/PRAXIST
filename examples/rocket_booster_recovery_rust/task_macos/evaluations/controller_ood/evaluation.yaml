schema_version: 1
name: rocket_booster_recovery_rust_controller_ood
kind: evaluation
version: 3.0.0
protocol_version: 2
stability: frozen
description: >-
  Deterministic Rust CPU evaluation of classical Rocket Booster Recovery controller
  variants on a disjoint three-stratum landing validation set and a frozen
  roll-disturbance set. Scoring stops at interpolated first leg contact.
compatibility:
  praxist_core: ">=0.3.0,<1.0"
  rust: ">=1.85"
dependencies:
  - rust-standard-library
  - repository-locked-cargo-workspace
capabilities:
  - evaluation.control
  - evaluation.cpu
  - evaluation.rust
  - evaluation.multi_metric_pareto
  - evaluation.evidence_maturity
  - evaluation.first_contact_safety
evaluation:
  primary_metrics: [landing_success_rate]
  evidence_stages: [canary, development, roll_diagnostic, complete]
  staged_protocols:
    canary:
      ranking_allowed: false
      parent_promotion_allowed: false
      purpose: public_interface_and_wiring_check
    development:
      ranking_allowed: true
      parent_promotion_allowed: false
      purpose: fast_iteration_on_the_precommitted_public_development_set
    roll_diagnostic:
      ranking_allowed: false
      parent_promotion_allowed: false
      purpose: isolated_roll_rcs_disturbance_rejection
    complete:
      ranking_allowed: true
      parent_promotion_allowed: true
      purpose: full_close_grade_landing_and_roll_protocol
agent_entrypoint: ../../Cargo.toml
code:
  - ../../Cargo.toml
  - ../../src/bin/evaluator.rs
  - ../../src/evaluator.rs
  - ../../src/manifest.rs
  - ../../src/rollout.rs
  - ../../src/candidate_api.rs
assets:
  - ../../assets/dataset_metadata/validation_protocol.json
