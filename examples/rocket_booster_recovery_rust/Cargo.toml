[package]
name = "rocket-booster-recovery-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust CPU implementation of the deterministic Rocket Booster Recovery rocket landing baseline"
readme = "README.md"
repository = "https://github.com/sapientinc/praxist"
publish = false

[workspace]
resolver = "3"
members = ["task_GPU_server"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
ndarray = "0.16"
ndarray-npy = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
